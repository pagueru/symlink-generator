name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint e testes
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o uv e o Python 3.13
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sincroniza as dependências
        run: uv sync

      - name: Ruff check
        run: uv run ruff check --no-fix .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
